<!DOCTYPE html>
<html>
<head>
<title>My Zomato</title>
<style>
body { font-family: Arial; text-align: center; background: #fff5f5; }
h1 { color: #e23744; }
.card { border: 1px solid #ddd; padding: 15px; margin: 15px; display: inline-block; width: 220px; border-radius: 10px; background: white; vertical-align: top; }
.card img { width: 100%; height: 140px; border-radius: 8px; object-fit: cover; }
button { background: #e23744; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>
<h1>My Zomato</h1>
<p>Order delicious food online!</p>

<div class="card">
<img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400" alt="Pizza">
<h3>Pizza - Rs 299</h3>
<p>Cheesy delicious pizza</p>
<button onclick="orderNow('Pizza', 299)">Order Now</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" alt="Burger">
<h3>Burger - Rs 149</h3>
<p>Crispy veg burger</p>
<button onclick="orderNow('Burger', 149)">Order Now</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=400" alt="Biryani">
<h3>Biryani - Rs 199</h3>
<p>Hyderabadi dum biryani</p>
<button onclick="orderNow('Biryani', 199)">Order Now</button>
</div>

<script>
function orderNow(item, price) {
  alert(item + " ordered! Total: Rs " + price);
}
</script>
</body>
</html>
