<!DOCTYPE html>
<html>
<head>
<title>My Zomato</title>
<style>
body { font-family: Arial; margin:0; background:#fff5f5; }
.header { background:#e23744; color:white; padding:20px; text-align:center; }
.card { background:white; margin:20px; padding:15px; border-radius:10px; box-shadow: 0 2px 5px grey; }
button { background:#e23744; color:white; border:none; padding:10px 20px; border-radius:5px; }
</style>
</head>
<body>
<div class="header">
<h1>My Zomato</h1>
<p>Order Your Favourite Food</p>
</div>

<div class="card">
<h3>Pizza - Rs 299</h3>
<p>Cheesy delicious pizza</p>
<button>Order Now</button>
</div>

<div class="card">
<h3>Burger - Rs 149</h3>
<p>Crispy veg burger</p>
<button>Order Now</button>
</div>

<div class="card">
<h3>Biryani - Rs 199</h3>
<p>Hyderabadi dum biryani</p>
<button>Order Now</button>
</div>
</body>
</html>
